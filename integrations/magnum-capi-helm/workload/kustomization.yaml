apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openstack-gateway-system
namePrefix: magnum-

resources:
  - ../../../config/rbac
  - ../../../config/manager

patches:
  - target:
      kind: ConfigMap
      name: openstack-gateway-controller-config
    patch: |-
      - op: replace
        path: /data/GATEWAY_OPENSTACK_CONTROLLER_NAME
        value: gateway-api-openstack.github.io/magnum-gateway
