apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openstack-gateway-system
namePrefix: magnum-

resources:
  - ../../../config/rbac
  - ../../../config/manager

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openstack-gateway-controller
      spec:
        template:
          spec:
            volumes:
              - name: openstack-clouds
                secret:
                  items: null
  - target:
      kind: ConfigMap
      name: openstack-gateway-controller-config
    patch: |-
      - op: replace
        path: /data/GATEWAY_OPENSTACK_CONTROLLER_NAME
        value: gateway-api-openstack.github.io/magnum-gateway
