apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openstack-gateway-system

resources:
  - namespace.yaml
  - ../crd
  - ../rbac
  - ../manager

# Select the recorded development image digest or your operator build
# before applying this kustomization.
images:
  - name: controller
    newName: example.invalid/openstack-gateway-controller
    newTag: v0.3.0-dev
