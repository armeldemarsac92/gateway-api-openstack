apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openstack-gateway-controller
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: GATEWAY_OPENSTACK_TLS_CERTIFICATE_MAP
                    value: /etc/gateway-operator/certificates/map.json
                volumeMounts:
                  - name: operator-certificate-map
                    mountPath: /etc/gateway-operator/certificates
                    readOnly: true
            volumes:
              - name: operator-certificate-map
                configMap:
                  name: openstack-gateway-tls-revisions
                  optional: true
                  items:
                    - key: map.json
                      path: map.json
