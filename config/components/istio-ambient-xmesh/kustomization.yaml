apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: controller
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --istio-ambient-xmesh
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openstack-gateway-controller
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: GATEWAY_OPENSTACK_POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: ["gateway.networking.x-k8s.io"]
          resources: ["xmeshes"]
          verbs: ["get", "list", "watch", "create"]
      - op: add
        path: /rules/-
        value:
          apiGroups: ["gateway.networking.x-k8s.io"]
          resources: ["xmeshes/status"]
          verbs: ["patch"]
      - op: add
        path: /rules/-
        value:
          apiGroups: ["apps"]
          resources: ["deployments"]
          resourceNames: ["istiod"]
          verbs: ["get"]
      - op: add
        path: /rules/-
        value:
          apiGroups: ["apps"]
          resources: ["daemonsets"]
          resourceNames: ["istio-cni-node", "ztunnel"]
          verbs: ["get"]
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: ["configmaps"]
          resourceNames: ["istio-cni-config"]
          verbs: ["get"]
