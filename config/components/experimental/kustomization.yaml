apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      version: v1
      kind: ConfigMap
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      - op: replace
        path: /data/GATEWAY_OPENSTACK_GATEWAY_API_CHANNEL
        value: experimental
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: [""]
          resources: ["pods"]
          verbs: ["list", "watch"]
      - op: add
        path: /rules/-
        value:
          apiGroups: ["gateway.networking.x-k8s.io"]
          resources: ["xbackends"]
          verbs: ["get", "list", "watch"]
      - op: add
        path: /rules/-
        value:
          apiGroups: ["gateway.networking.x-k8s.io"]
          resources: ["xbackends/status"]
          verbs: ["patch"]
