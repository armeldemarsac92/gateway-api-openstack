apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: openstack-gateway-controller-config
      data:
        GATEWAY_OPENSTACK_OCTAVIA_MICROVERSION: "2.24"

replacements:
  - source:
      kind: ConfigMap
      name: openstack-gateway-controller-config
      fieldPath: data.GATEWAY_OPENSTACK_OCTAVIA_MICROVERSION
    targets:
      - select:
          group: apps
          version: v1
          kind: Deployment
          labelSelector: app.kubernetes.io/name=openstack-gateway-controller
        fieldPaths:
          - 'spec.template.spec.containers.[name=controller].args.[=^--octavia-microversion=2[.](5|8|24)$]'
        options:
          delimiter: "="
          index: 1
