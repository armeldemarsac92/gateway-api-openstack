apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: controller
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --istio-ambient-service-imports
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      labelSelector: app.kubernetes.io/name=openstack-gateway-controller
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: ["multicluster.x-k8s.io"]
          resources: ["serviceimports"]
          verbs: ["list", "watch"]
      - op: add
        path: /rules/-
        value:
          apiGroups: ["networking.istio.io"]
          resources: ["serviceentries"]
          verbs: ["list", "watch", "create", "update", "delete"]
