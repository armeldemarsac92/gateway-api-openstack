apiVersion: v1
kind: Namespace
metadata:
  name: hibiscus-worker-http
---
apiVersion: v1
kind: Pod
metadata:
  namespace: hibiscus-worker-http
  name: echo
  labels:
    app: echo
spec:
  nodeSelector:
    gateway-api-openstack-test-worker: "true"
  containers:
    - name: echo
      image: registry.k8s.io/gateway-api/conformance/echo-basic:v0.1.0@sha256:640d843263062f4391ecd74effd68673a69800852eb4ff31b8452a3301eae83b
      ports:
        - name: http
          containerPort: 3000
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
---
apiVersion: v1
kind: Service
metadata:
  namespace: hibiscus-worker-http
  name: echo
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: echo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
